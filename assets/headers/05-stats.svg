<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" fill="none" role="img" aria-labelledby="title"><title id="title">05 — Stats: Commit history</title><style><![CDATA[@font-face{font-family:jb4;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:jb6;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:sg7;src:url(data:font/woff2;base64,) format('woff2')}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.tw{animation:tw 4s ease-in-out infinite}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style><defs><linearGradient id="lab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EC4899" stop-opacity="1"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="1"/></linearGradient><linearGradient id="ttl" x1="0" y1="0" x2="370.7" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A855F7" stop-opacity="1"/><stop offset="0.45" stop-color="#6366F1" stop-opacity="1"/><stop offset="1" stop-color="#0891B2" stop-opacity="1"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7" stop-opacity="0.7"/><stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.35"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient><linearGradient id="spark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EC4899" stop-opacity="0"/><stop offset="0.5" stop-color="#EC4899" stop-opacity="1"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></linearGradient></defs><text x="2" y="34" font-family="jb6,'JetBrains Mono',ui-monospace,monospace" font-size="15" fill="url(#lab)" letter-spacing="4" xml:space="preserve" style="white-space:pre">05  /  STATS</text><text x="0" y="100" font-family="sg7,'Space Grotesk',system-ui,sans-serif" font-size="52" fill="url(#ttl)" letter-spacing="-1" xml:space="preserve" style="white-space:pre">Commit history</text><text x="1200" y="100" font-family="jb4,'JetBrains Mono',ui-monospace,monospace" font-size="16" fill="#7D8590" text-anchor="end" xml:space="preserve" style="white-space:pre">// consistency &gt; intensity</text><rect y="122" width="1200" height="1.5" rx=".75" fill="url(#line)"/><rect x="-180" y="121.25" width="180" height="3" rx="1.5" fill="url(#spark)"><animate attributeName="x" values="-180;1200" dur="6s" begin="3.5s" repeatCount="indefinite"/></rect></svg>
